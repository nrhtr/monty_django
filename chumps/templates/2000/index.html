{% extends "2000/_layout.html" %}
{% load static %}
{% load l10n %}
{% block content %}
  <table width="85%" cellpadding="0" cellspacing="0">
    <tbody>
      <tr>
        <td>
          <img src="{% static 'images/2000/tabletop_left.jpg' %}" />
        </td>
        <td width="100%"
            align="right"
            background="{% static 'images/2000/tabletop_center.jpg' %}">
          <b>
            <font color="FFFFFF">{{ latest_chump.date|localize }}</font>
          </b>
        </td>
        <td>
          <img src="{% static 'images/2000/tabletop_right.jpg' %}" />
        </td>
      </tr>
    </tbody>
  </table>
  <table width="85%" cellpadding="5">
    <tbody>
      <tr>
        <td width="100%">
          <p>
            <font face="Tahoma" size="6">
              <span>{{ latest_chump.streak }} days ago!</span>
            </font>
          </p>
          <p>
            <font face="Tahoma" size="4">
              <a href={{ latest_chump.url }} target="_blank">
                <span>{{ latest_chump.name }}</span>
              </a>
            </font>
          </p>
          <font face="Tahoma" size="1">
            <p>
              {% with latest_chump.media|first as image %}
                <img src="{{ image.url }}" alt="{{ latest_chump.name }}" width="400" />
              {% endwith %}
            </p>
          </font>
        </td>
      </tr>
    </tbody>
  </table>
{% endblock %}
